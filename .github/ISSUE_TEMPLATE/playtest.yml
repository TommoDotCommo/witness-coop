name: Playtest report
description: Tell us how a session went, including what worked.
labels: [playtest]
body:
  - type: markdown
    attributes:
      value: |
        Sessions that went well matter too: some things (long internet games, other people's routers and firewalls, real
        microphones, many players) can only be checked by real players. Anything that broke also deserves its own bug report
        with the diagnostics zip (the launcher's **Send diagnostics** button).
  - type: input
    id: version
    attributes:
      label: Mod version
      placeholder: e.g. v0.1.0-alpha
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Players and connection
      placeholder: e.g. 3 players over the lobby, two countries
    validations:
      required: true
  - type: input
    id: played
    attributes:
      label: What you played
      placeholder: e.g. the tutorial to the first door, about 90 minutes
    validations:
      required: true
  - type: checkboxes
    id: tried
    attributes:
      label: What you tried
      options:
        - label: Hosting a lobby and joining one over the internet
        - label: A session of an hour or more
        - label: Solving panels together (the other player sees the solve and the door)
        - label: Chat, pings, drawing and the emote wheel
        - label: Voice chat with a real microphone
        - label: Watching a partner's screen (V)
        - label: A race
        - label: More than two players
        - label: Restarting a game mid-session and rejoining
  - type: textarea
    id: how
    attributes:
      label: How it went
      description: What worked, what felt off, lag, anything confusing.
    validations:
      required: true
